# Heretic run on Qwen3.5-4B: the classic abliteration modifier with Heretic's
# own optimiser.  Same trial budget, seed and protocol as the 1.5B and 0.5B
# comparison runs; the model is the local checkout of Qwen/Qwen3.5-4B.
model = "models/Qwen3.5-4B"

dtypes = ["auto"]
quantization = "none"
device_map = "auto"
offload_outputs_to_cpu = true
batch_size = 0
max_batch_size = 128
max_response_length = 100
print_debug_information = true

seed = 12345

n_trials = 40
n_startup_trials = 15

export_strategy = "merge"
checkpoint_action = "restart"
trial_index = 0
model_action = "save"
save_directory = "out/heretic_mpoa_35b/model"
study_checkpoint_dir = "out/heretic_mpoa_35b/checkpoints"

scorers = [
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

modifiers = [
    { plugin = "heretic.modifiers.abliteration.Abliteration" },
]

[modifier.Abliteration]
orthogonalize_direction = true
row_normalization = "full"
full_normalization_lora_rank = 3
